name: Publish to GHCR

on:
  push:
    branches: [main, master, development]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - "docker-compose.yml"
      - "podman-compose.override.yml"
      - ".dockerignore"
      - ".gitignore"
      - ".gitattributes"
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag of dr1s/tortoise-wow to build"
        required: false
        default: "development"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: development
            build_modules: "static"
            extractors_only: "OFF"
            is_latest: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream source and module commits
        id: source
        run: |
          REF="${{ github.event.inputs.source_ref || 'main' }}"
          SHA="$(git ls-remote https://github.com/dr1s/tortoise-wow.git "refs/heads/${REF}" | cut -f1)"
          SHORT_SHA="${SHA:0:6}"
          if [ -z "${SHA}" ]; then
            echo "Could not resolve ref ${REF} on dr1s/tortoise-wow" >&2
            exit 1
          fi
          echo "Resolved upstream ${REF} -> ${SHA}"

          SOURCE_COMMIT="${SHA}"
          while IFS='|' read -r MODULE_URL MODULE_NAME MODULE_REF; do
            case "${MODULE_URL}" in
              ''|'#'*) continue ;;
            esac
            MODULE_SHA="$(git ls-remote "${MODULE_URL}" "refs/heads/${MODULE_REF}" | cut -f1)"
            if [ -z "${MODULE_SHA}" ]; then
              echo "Could not resolve ref ${MODULE_REF} for module ${MODULE_NAME} at ${MODULE_URL}" >&2
              exit 1
            fi
            echo "Resolved module ${MODULE_NAME} ${MODULE_REF} -> ${MODULE_SHA}"
            SOURCE_COMMIT="${SOURCE_COMMIT}-${MODULE_SHA}"
          done < tortoise-wow/docker/modules.conf

          echo "SOURCE_COMMIT=${SOURCE_COMMIT}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_commit=${SOURCE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag }}
            type=raw,value=${{ matrix.tag }}-${{ steps.source.outputs.short_sha }}
            type=raw,value=latest,enable=${{ matrix.is_latest && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Get number of CPUs
        id: cpus
        run: echo "count=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tortoise-wow
          file: ./tortoise-wow/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime
          build-args: |
            BUILD_MODULES=${{ matrix.build_modules }}
            BUILD_JOBS=${{ steps.cpus.outputs.count }}
            EXTRACTORS_ONLY=${{ matrix.extractors_only }}
            USE_EXTRACTORS=OFF
            SOURCE_REPO=https://github.com/dr1s/tortoise-wow.git
            SOURCE_REF=${{ github.event.inputs.source_ref || 'development' }}
            SOURCE_COMMIT=${{ steps.source.outputs.source_commit }}
            CMAKE_BUILD_TYPE=Release
            CMAKE_INSTALL_PREFIX=/opt/turtle
            CPU_TARGET=x86-64-v2
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          provenance: false
